<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building a table</title>
    <meta name="description"
      content="Making a table with the information of a league and its total players">
    <meta name="author" content="Trevlon Thomas">
    <link rel="stylesheet" href="styles/table.css">
</head>


<table>
    <!--heading of the table data-->
    <thead>
        <tr>
            <th>League</th>
            <th>Team</th>
            <th>Record</th>
            <th>Player Count</th>
        </tr>
    </thead>

    <!--table data-->
    <tbody>
        <tr>
            <td rowspan="2">Southern</td>
            <td>Parana</td>
            <td>52-19</td>
            <td>23</td>
        </tr>
        <tr class="caterina-background-color">
            <td>Catarina</td>
            <td>49-24</td>
            <td>10</td>
        </tr>

        <tr>
            <td rowspan="3">Western</td>
            <td>Lacerda</td>
            <td>92-70</td>
            <td>27</td>
        </tr>
        <tr class="acre-background-color">
            <td>Acre</td>
            <td>75-87</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Rondonia</td>
            <td>10-7</td>
            <td>12</td>
        </tr>
    </tbody>

    <!--footer with the total players-->
    <tfoot>
        <tr>
            <td colspan="3">Total Players</td>
            <td>92</td>
        </tr>
    </tfoot>
</table>


</body>

</html>
