<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Trevlon Thomas">
    <meta name="description" content="making an interactive form where users can contact us">
    <title>Contact Us Page Form</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!--logo and navigation links withing header tags-->
    <header>
        <img src="images/water-rafting-logo.jpg"
          alt="water raft logo with a splash of water in the back">
        <nav>

            <ul class="flex-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>

    <main>
        <div class="hero-title">
            <h1>White Water Rafting Company</h1>
            <h2>123 Main River Street</h2>
            <h2>Kolob, California</h2>
            <h2>+1 999 999 9999</h2>
            <h2>info@whitewater.com</h2>
        </div>


        <form class="grid-form">

            <div class="form-data name-label">
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" placeholder="First Name">
            </div>

            <br>

            <div class="form-data email-label">
                <label for="useremail">Email:</label>
                <input type="text" name="useremail" id="useremail" placeholder="Email Address">
            </div>

            <br>
            <div class="form-data">
                <label for="message">Message Purpose:</label>
                <input type="radio" name="question" id="message" value="general inquiry">
                <label for="message">General Inquiry</label>
            </div>

            <br>

            <div class="form-data message">
                <input type="radio" name="question" id="question" value="reservation question">
                <label for="question">Reservation Question</label>
            </div>

            <br>

            <div class="form-data message">
                <input type="radio" name="question" id="suggestion" value="website suggestion">
                <label for="suggestion">Website Suggestion</label>
            </div>

            <br>

            <label for="multi-message">Message</label>
            <textarea name="multi-message" id="multi-message" rows="4"
              placeholder="Type here"></textarea>

            <br>

            <div class="form-data">
                <input type="checkbox" name="check" id="check">
                <label for="check">Please subscribe me to the monthly newsletter</label>
            </div>

            <button type="submit">Get in touch!</button>

            <iframe class="google-map"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3187.3159256795398!2d-122.0291326243355!3d36.978391472196854!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808e402563ff7b33%3A0x5912c5ee33d84140!2s123%20River%20St%2C%20Santa%20Cruz%2C%20CA%2095060%2C%20USA!5e0!3m2!1sen!2stt!4v1785368309064!5m2!1sen!2stt"
              width="400" height="390" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </form>

        <br><br>

        <div class="section-two">
            <h2>We are here to serve</h2>
        </div>

        <div class="three-images">
            <img class="first-image" src="images/woman-with-short-hair.jpg"
              alt="woman with short hair">
            <img class="second-image" src="images/woman-smiling.jpg" alt="woman smiling">
            <img class="third-image" src="images/man-in-office.jpeg" alt="man in a office">
        </div>
    </main>

    <footer>
        <p>©️2026 🎋 White Water Rafting 🎋 Trevlon Thomas</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com"><img src="images/facebook.png"
                  alt="facebook logo"></a>
            <a href="https://www.instagram.com"><img src="images/instagram.png"
                  alt=" intsagram logo"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin.png"
                  alt="linkedin logo"></a>
        </nav>
    </footer>
</body>

</html>
